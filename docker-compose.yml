services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: boardroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardroom
      POSTGRES_PASSWORD: boardroom
      POSTGRES_DB: boardroom
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardroom -d boardroom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
